name: "Test packages"
on: [push, pull_request]

jobs:
  python3:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.7",
          "3.8",
          "3.9",
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]

    container:
      image: python:${{ matrix.python-version }}-alpine

    steps:
    - name: Show OS
      run: cat /etc/os-release

    - name: Install system dependencies
      run: apk add --no-cache git coreutils

    - name: Git checkout
      uses: actions/checkout@v7

    - name: Install dependencies
      run: pip install .[testing] build

    - name: Build package
      run: python3 -m build

    - name: Test with pytest
      run: pytest -m "not qemu and not ssh and not ltx"
