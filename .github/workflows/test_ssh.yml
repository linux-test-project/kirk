name: "Test SSH"
on: [push, pull_request]

env:
  TEST_SSH_KEY_FILE: /tmp/id_rsa
  TEST_SSH_USERNAME: runner
  TEST_SSH_PASSWORD: password
  TEST_SSH_PORT: 22

jobs:
  python3:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.7",
          "3.8",
          "3.9",
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]

    container:
      image: python:${{ matrix.python-version }}-alpine

    steps:
    - name: Show OS
      run: cat /etc/os-release

    - name: Install system dependencies
      run: apk add --no-cache git openssh sudo gcc musl-dev libffi-dev

    - name: Git checkout
      uses: actions/checkout@v7

    - name: Install dependencies
      run: pip install .[testing,ssh]

    - name: Setup SSH server and keys
      run: |
        ssh-keygen -A
        adduser -D -s /bin/sh "$TEST_SSH_USERNAME"
        echo "$TEST_SSH_USERNAME:$TEST_SSH_PASSWORD" | chpasswd
        echo "$TEST_SSH_USERNAME ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/runner
        mkdir -p "/home/$TEST_SSH_USERNAME/.ssh" "$HOME/.ssh" /root/.ssh
        ssh-keygen -t rsa -N "" -f "$TEST_SSH_KEY_FILE"
        cp "$TEST_SSH_KEY_FILE.pub" "/home/$TEST_SSH_USERNAME/.ssh/authorized_keys"
        chown -R "$TEST_SSH_USERNAME:$TEST_SSH_USERNAME" "/home/$TEST_SSH_USERNAME/.ssh"
        chmod 700 "/home/$TEST_SSH_USERNAME/.ssh"
        chmod 600 "/home/$TEST_SSH_USERNAME/.ssh/authorized_keys"
        echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
        echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
        /usr/sbin/sshd
        ssh-keyscan -H localhost > "$HOME/.ssh/known_hosts"
        ssh-keyscan -H 127.0.0.1 >> "$HOME/.ssh/known_hosts"
        ssh-keyscan -H ::1 >> "$HOME/.ssh/known_hosts"
        cp -a "$HOME/.ssh/." /root/.ssh/ 2>/dev/null || true

    - name: Test with pytest
      run: pytest -m "ssh"
