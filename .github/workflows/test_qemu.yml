name: "Test QEMU"
on: [push, pull_request]

env:
  ALPINE_KERNEL_URL: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/netboot-3.24.2/vmlinuz-virt

jobs:
  python3:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.7",
          "3.8",
          "3.9",
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]

    container:
      image: python:${{ matrix.python-version }}-alpine
      options: --device /dev/kvm

    steps:
    - name: Show OS
      run: cat /etc/os-release

    - name: Install QEMU and Busybox
      run: apk add --no-cache git qemu-system-x86_64 busybox-static

    - name: Git checkout
      uses: actions/checkout@v7

    - name: Install dependencies
      run: pip install .[testing]

    - name: Download Alpine kernel
      run: wget -q -O /tmp/vmlinuz-virt "$ALPINE_KERNEL_URL"

    - name: Create Busybox initramfs
      run: |
        mkdir -p /tmp/initramfs/bin /tmp/initramfs/dev /tmp/initramfs/proc \
          /tmp/initramfs/sys /tmp/initramfs/tmp
        cp /bin/busybox.static /tmp/initramfs/bin/busybox
        cat << 'EOF' > /tmp/initramfs/init
        #!/bin/busybox sh
        /bin/busybox --install -s /bin
        mount -t devtmpfs devtmpfs /dev 2>/dev/null || true
        mount -t proc proc /proc 2>/dev/null || true
        mount -t sysfs sysfs /sys 2>/dev/null || true
        chmod 1777 /tmp
        [ -c /dev/ttyS0 ] || mknod /dev/ttyS0 c 4 64
        [ -c /dev/ttyS1 ] || mknod /dev/ttyS1 c 4 65
        export PS1='/ # '
        stty -F /dev/ttyS0 isig 2>/dev/null || true
        # ttyS0 must be the controlling terminal to deliver CTRL+C
        while true; do
            setsid -c /bin/sh </dev/ttyS0 >/dev/ttyS0 2>&1
        done
        EOF
        chmod +x /tmp/initramfs/init
        (cd /tmp/initramfs && find . | cpio -o -H newc | gzip -9) > /tmp/initrd.img

    - name: Test with pytest
      timeout-minutes: 10
      env:
        TEST_QEMU_KERNEL: /tmp/vmlinuz-virt
        TEST_QEMU_BUSYBOX: /tmp/initrd.img
      run: python3 -m pytest -m "qemu"
